<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 64" width="34" height="30" role="img" aria-label="Beatrix the ball python coiled">
  <!-- Coiled ball python: thick Curtain Red spiral with a small raised head and forked tongue -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- faint Velvet Sheen highlight tracing the outer back of the coil -->
    <path d="M34 54
             C16 53 9 39 12 27
             C15 16 25 10 35 11"
          stroke="#A8323B" stroke-width="2" opacity="0.5"/>
    <!-- main spiral body: outer loop spiralling inward to a soft center -->
    <path d="M34 55
             C15 55 7 38 11 25
             C15 13 29 7 41 13
             C50 18 51 28 45 34
             C40 39 32 38 30 32
             C28 27 33 23 38 25
             C41 26 42 29 40 31"
          stroke="#7B1E26" stroke-width="6.5"/>
    <!-- neck rising from the top of the coil up to the head -->
    <path d="M41 13
             C39 8 40.5 4.5 45 4.5"
          stroke="#7B1E26" stroke-width="6"/>
  </g>
  <!-- head: a clean rounded snout, slightly tapered, overlapping the neck -->
  <path d="M45.5 1.2
           C50.5 1.2 53.6 3.2 53.6 6
           C53.6 9.2 50.2 11 46 10.6
           C42.6 10.3 41.6 8 42 5.4
           C42.4 2.8 43.4 1.2 45.5 1.2 Z"
        fill="#7B1E26"/>
  <!-- eye, Lamp Gold glint -->
  <circle cx="49.6" cy="5.1" r="1.15" fill="#C8A24B"/>
  <!-- forked tongue flick, thin Curtain Red -->
  <g fill="none" stroke="#7B1E26" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M54.2 5 C58 4 60 5 62.4 3.6"/>
    <path d="M61.2 4.3 L64 2.9"/>
    <path d="M61.4 5.1 L64.2 5"/>
  </g>
</svg>
