<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 96" width="40" height="96" role="img" aria-label="Traffic light status indicator">
  <!-- mast / pole -->
  <line x1="20" y1="80" x2="20" y2="93" stroke="#8A8579" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M13 93 Q20 90 27 93" fill="none" stroke="#8A8579" stroke-width="2.2" stroke-linecap="round"/>

  <!-- housing: black fill with thin gray keyline so it reads on both grounds -->
  <rect x="6" y="6" width="28" height="74" rx="11" fill="#0B0A09" stroke="#8A8579" stroke-width="1.6"/>
  <!-- inner pine accent line -->
  <rect x="9.4" y="9.4" width="21.2" height="67.2" rx="8" fill="none" stroke="#3C5249" stroke-width="0.9"/>

  <!-- top lamp: dim desaturated red, clearly off -->
  <circle cx="20" cy="24" r="7" fill="#3A1216" stroke="#7B1E26" stroke-width="0.8"/>

  <!-- middle lamp: dim pine / gray, clearly off -->
  <circle cx="20" cy="43" r="7" fill="#1C2622" stroke="#3C5249" stroke-width="0.8"/>

  <!-- bottom lamp: ACTIVE, lit gold with soft amber glow -->
  <g>
    <circle cx="20" cy="62" r="12.5" fill="#C8A24B" opacity="0.28">
      <animate attributeName="opacity" values="0.28;0.13;0.28" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="62" r="7" fill="#C8A24B" stroke="#E6DFCF" stroke-width="0.6">
      <animate attributeName="opacity" values="1;0.75;1" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <!-- subtle inner glint -->
    <circle cx="17.4" cy="59.4" r="2.1" fill="#E6DFCF" opacity="0.55"/>
  </g>
</svg>
